[project]
name = "pwg-sim"
version = "0.1.0"
description = "Physical simulation of the 2D-programmable multimode waveguide of Onodera et al. in Dr.Jit / Mitsuba 3"
license = { text = "Apache-2.0" }
authors = [{ name = "Ranvier Systems" }]
requires-python = ">=3.10"
dependencies = ["drjit>=1.0", "mitsuba>=3.6", "numpy", "scipy", "matplotlib", "scikit-learn", "pytest"]

[tool.setuptools]
packages = ["pwg"]

[tool.pytest.ini_options]
pythonpath = ["."]
